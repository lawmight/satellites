name: Sync upstream

on:
  schedule:
    # A fork does not receive the parent repo's push events, so this polls.
    # Four times an hour, off the top of the hour, when GitHub is less likely to delay the run.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'lawmight/satellites'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main)"
          echo "$response"
          type="$(printf '%s' "$response" | jq -r '.merge_type // empty')"
          case "$type" in
            fast-forward|merge|none)
              echo "sync ok ($type)"
              ;;
            *)
              echo "unexpected sync result"
              exit 1
              ;;
          esac
